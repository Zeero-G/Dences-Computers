name: dences-dev
services:
  frontend:
    image: dences-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  frontend_node_modules:
  frontend_next:
